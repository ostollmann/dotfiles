set-option -g prefix C-a
bind '\' split-window -h
bind - split-window -v
#unbind '"'
#unbind %

#bind r source-file ~/.tmux.conf
#set -g default-terminal "screen-256color"
#set-option -g allow-rename off

bind h select-pane -L
bind k select-pane -U
bind j select-pane -D
bind l select-pane -R
bind -n M-k resize-pane -U 5
bind -n M-j resize-pane -D 5
bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5

# F12 toggles this tmux into "off" mode: prefix is unset and all keys flow
# through to whatever's in the pane (ie. a nested tmux on a devbox over ssh).
# Press F12 again to wake. Status bar greys out while off as a visual cue.
# Safe in both single-layer and nested setups: the outer tmux always wins
# F12, so the inner never sees it from a wrapping session.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=colour245,fg=colour16' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

